<!doctype html>
<html>
  <body style="margin:0;background:#f7f9f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#202b27">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e4eae7;border-radius:16px;padding:32px">
          <tr><td style="font-size:22px;font-weight:800;letter-spacing:-0.5px;padding-bottom:24px">
            <span style="color:#0f1f17">tiny</span><span style="color:#168a56">ops.</span>
          </td></tr>
          <tr><td style="font-size:20px;font-weight:700;padding-bottom:8px">Confirm your new email</td></tr>
          <tr><td style="font-size:15px;line-height:1.6;color:#4a5852;padding-bottom:24px">Confirm that you want to use {{ .NewEmail }} for your TinyOps account.</td></tr>
          <tr><td style="padding-bottom:24px">
            <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email_change" style="display:inline-block;background:#168a56;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 22px;border-radius:10px">Confirm new email</a>
          </td></tr>
          <tr><td style="font-size:13px;line-height:1.6;color:#718078">If you didn't request this change, please secure your account by resetting your password.</td></tr>
        </table>
        <p style="font-size:12px;color:#718078;margin-top:16px">TinyOps &middot; Your business, organized.</p>
      </td></tr>
    </table>
  </body>
</html>
